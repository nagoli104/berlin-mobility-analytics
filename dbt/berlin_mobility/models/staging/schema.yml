version: 2

models:
  - name: stg_mobility_counts
    description: Hourly bike count observations by station.
    columns:
      - name: observed_at
        tests:
          - not_null
      - name: station_id
        tests:
          - not_null
      - name: bike_count
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - observed_at
              - station_id

  - name: stg_station_metadata
    description: Bike counting station metadata.
    columns:
      - name: station_id
        tests:
          - not_null
          - unique

  - name: stg_weather_hourly
    description: Hourly weather observations for the selected Berlin weather coordinate.
    columns:
      - name: weather_at
        tests:
          - not_null
          - unique
