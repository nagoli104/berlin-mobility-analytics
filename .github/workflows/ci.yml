name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Static and dbt Checks
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      MOBILITY_DB: mobility
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Check uv lockfile
        run: uv lock --check

      - name: Compile Python files
        run: python -m compileall scripts airflow/dags

      - name: Validate Docker Compose config
        run: docker compose --env-file .env.example -f docker/docker-compose.yml config

      - name: Install dbt packages
        run: uv run --group dbt dbt deps --project-dir dbt/berlin_mobility

      - name: Parse dbt project
        run: >
          uv run --group dbt dbt parse
          --project-dir dbt/berlin_mobility
          --profiles-dir dbt/berlin_mobility
