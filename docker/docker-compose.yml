x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/airflow/Dockerfile
  image: berlin-mobility-airflow:latest
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${AIRFLOW_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW_CONN_MOBILITY_POSTGRES: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${MOBILITY_DB}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    MOBILITY_DB: ${MOBILITY_DB}
    MOBILITY_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${MOBILITY_DB}
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../scripts:/opt/airflow/scripts
    - ../data:/opt/airflow/data
    - ../dbt:/opt/airflow/dbt
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - mobility_net

services:
  postgres:
    image: postgres:15
    container_name: mobility_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_DB: ${AIRFLOW_DB}
      METABASE_DB: ${METABASE_DB}
      MOBILITY_DB: ${MOBILITY_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - mobility_net

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command: -c 'airflow db migrate && airflow users create --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" --firstname "${AIRFLOW_ADMIN_FIRSTNAME}" --lastname "${AIRFLOW_ADMIN_LASTNAME}" --role Admin --email "${AIRFLOW_ADMIN_EMAIL}"'
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    ports:
      - "8080:8080"
    command: webserver
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    depends_on:
      - airflow-init

  metabase:
    image: metabase/metabase:latest
    container_name: mobility_metabase
    ports:
      - "3000:3000"
    environment:
      MB_SETUP_TOKEN: ${MB_SETUP_TOKEN}
      MB_LOAD_SAMPLE_CONTENT: "false"
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mobility_net

  metabase-seed:
    image: python:3.11-slim
    container_name: mobility_metabase_seed
    depends_on:
      - metabase
    environment:
      MB_SETUP_TOKEN: ${MB_SETUP_TOKEN}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      METABASE_DB: ${METABASE_DB}
      MOBILITY_DB: ${MOBILITY_DB}
      METABASE_SETUP_EMAIL: ${METABASE_SETUP_EMAIL}
      METABASE_SETUP_PASSWORD: ${METABASE_SETUP_PASSWORD}
      METABASE_SETUP_FIRSTNAME: ${METABASE_SETUP_FIRSTNAME}
      METABASE_SETUP_LASTNAME: ${METABASE_SETUP_LASTNAME}
    volumes:
      - ../scripts:/scripts
    networks:
      - mobility_net
    entrypoint: /bin/sh
    command: -c "pip install --no-cache-dir psycopg2-binary >/dev/null && apt-get update >/dev/null && apt-get install -y curl >/dev/null && chmod +x /scripts/metabase_seed.sh && /scripts/metabase_seed.sh"
volumes:
  postgres_data:

networks:
  mobility_net:
