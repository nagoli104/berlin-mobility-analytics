[project]
name = "berlin-mobility-analytics"
version = "0.1.0"
description = "Local analytics pipeline for Berlin mobility and weather data."
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "openmeteo-requests",
    "openpyxl",
    "pandas",
    "psycopg2-binary",
    "requests-cache",
    "retry-requests",
]

[dependency-groups]
airflow = [
    "apache-airflow==2.8.1",
    "apache-airflow-providers-postgres",
]
dbt = [
    "dbt-postgres",
]
